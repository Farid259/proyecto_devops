{
  "global": {
    "scrape_interval": "15s",
    "evaluation_interval": "15s"
  },
  "rule_files": [
    "/etc/prometheus/alerts.yml"
  ],
  "scrape_configs": [
    {
      "job_name": "api",
      "dns_sd_configs": [
        {
          "names": [
            "api-metrics.devops.svc.cluster.local"
          ],
          "type": "A",
          "port": 8000,
          "refresh_interval": "15s"
        }
      ]
    }
  ]
}
