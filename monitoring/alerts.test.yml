{
  "rule_files": [
    "/etc/prometheus/alerts.yml"
  ],
  "evaluation_interval": "15s",
  "tests": [
    {
      "interval": "15s",
      "input_series": [
        {
          "series": "up{job=\"api\",instance=\"test\"}",
          "values": "0+0x5 1+0x6"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "ApiUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "No hay instancias disponibles de la API"
              }
            }
          ]
        },
        {
          "eval_time": "2m",
          "alertname": "ApiUnavailable",
          "exp_alerts": []
        }
      ]
    }
  ]
}
