name: CI - Tests, SAST, DAST y Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: Validar Terraform en Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - name: Validar sin credenciales ni acceso al backend AWS
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform fmt -check -recursive
          for directory in terraform terraform/bootstrap; do
            terraform -chdir="$directory" init -backend=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done

  monitoring:
    name: Validar Prometheus y alertas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar configuracion y caida/recuperacion simulada
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.0 test rules /etc/prometheus/alerts.test.yml

  tests:
    name: Pruebas Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Comprobar dependencias
        run: python -m pip check
      - name: Ejecutar pruebas
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: reports/pytest.xml
          retention-days: 14

  sast:
    name: SAST con Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Instalar analizador
        run: python -m pip install -r requirements-security.txt
      - name: Analizar codigo de la API
        run: |
          mkdir -p reports
          python -m bandit -r app -f json -o reports/bandit.json
      - name: Guardar reporte SAST
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-results
          path: reports/bandit.json
          retention-days: 14

  docker:
    name: Construir, probar, analizar DAST y publicar
    needs: [tests, sast, terraform, monitoring]
    outputs:
      image: ${{ steps.publish.outputs.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Definir nombre de imagen en minusculas
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir imagen para validacion
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar y esperar al healthcheck
        shell: bash
        run: |
          docker run -d --name api-ci -p 127.0.0.1:18000:8000 "$IMAGE:sha-$GITHUB_SHA"
          for attempt in {1..24}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' api-ci)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 5
          done
          docker logs api-ci
          exit 1
      - name: Comprobar API y usuario del contenedor
        shell: bash
        run: |
          test "$(docker exec api-ci id -u)" = 10001
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          base = 'http://127.0.0.1:18000'
          with urlopen(base + '/health', timeout=5) as response:
              assert json.load(response) == {'status': 'ok'}
          with urlopen(base + '/api/convert?celsius=20', timeout=5) as response:
              assert json.load(response) == {'celsius': 20.0, 'fahrenheit': 68.0, 'kelvin': 293.15}
          with urlopen(base + '/metrics', timeout=5) as response:
              assert b'http_requests_total' in response.read()
          PY
      - name: DAST activo con OWASP ZAP
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p reports/zap
          # Permitir que el usuario zap escriba solo en esta carpeta temporal.
          chmod a+w reports/zap
          docker run --rm --name zap-ci --network host \
            -v "$PWD/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://127.0.0.1:18000/openapi.json \
              -f openapi \
              -O http://127.0.0.1:18000 \
              -T 5 \
              -r report.html \
              -J report.json \
              -w report.md
      - name: Guardar reporte DAST
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-results
          path: reports/zap/
          retention-days: 14
      - name: Autenticarse en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar la misma imagen validada
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          [[ "$reference" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar logs del contenedor
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          if docker container inspect zap-ci > /dev/null 2>&1; then
            docker rm -f zap-ci
          fi
          if docker container inspect api-ci > /dev/null 2>&1; then
            docker logs api-ci > reports/container.log 2>&1
            docker inspect api-ci > reports/container-inspect.json
            docker rm -f api-ci
          fi
      - name: Guardar evidencias Docker
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-results
          path: |
            reports/container.log
            reports/container-inspect.json
          retention-days: 14

  deploy:
    name: CD AWS con aprobacion
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    with:
      image: ${{ needs.docker.outputs.image }}
