name: CI - Tests, SAST, DAST y Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Pruebas Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Comprobar dependencias
        run: python -m pip check
      - name: Ejecutar pruebas
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results
          path: reports/pytest.xml
          retention-days: 14

  sast:
    name: SAST con Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Instalar analizador
        run: python -m pip install -r requirements-security.txt
      - name: Analizar codigo de la API
        run: |
          mkdir -p reports
          python -m bandit -r app -f json -o reports/bandit.json
      - name: Guardar reporte SAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-results
          path: reports/bandit.json
          retention-days: 14

  docker:
    name: Construir, probar, analizar DAST y publicar
    needs: [tests, sast]
    outputs:
      image: ${{ steps.publish.outputs.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Definir nombre de imagen en minusculas
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Construir imagen para validacion
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar y esperar al healthcheck
        shell: bash
        run: |
          docker run -d --name api-ci -p 127.0.0.1:18000:8000 "$IMAGE:sha-$GITHUB_SHA"
          for attempt in {1..24}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' api-ci)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 5
          done
          docker logs api-ci
          exit 1
      - name: Comprobar API y usuario del contenedor
        shell: bash
        run: |
          test "$(docker exec api-ci id -u)" = 10001
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          base = 'http://127.0.0.1:18000'
          with urlopen(base + '/health', timeout=5) as response:
              assert json.load(response) == {'status': 'ok'}
          with urlopen(base + '/api/convert?celsius=20', timeout=5) as response:
              assert json.load(response) == {'celsius': 20.0, 'fahrenheit': 68.0, 'kelvin': 293.15}
          with urlopen(base + '/metrics', timeout=5) as response:
              assert b'http_requests_total' in response.read()
          PY
      - name: DAST activo con OWASP ZAP
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p reports/zap
          # Permitir que el usuario zap escriba solo en esta carpeta temporal.
          chmod a+w reports/zap
          docker run --rm --name zap-ci --network host \
            -v "$PWD/reports/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://127.0.0.1:18000/openapi.json \
              -f openapi \
              -O http://127.0.0.1:18000 \
              -T 5 \
              -r report.html \
              -J report.json \
              -w report.md
      - name: Guardar reporte DAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-results
          path: reports/zap/
          retention-days: 14
      - name: Autenticarse en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar la misma imagen validada
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          [[ "$reference" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar logs del contenedor
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          if docker container inspect zap-ci > /dev/null 2>&1; then
            docker rm -f zap-ci
          fi
          if docker container inspect api-ci > /dev/null 2>&1; then
            docker logs api-ci > reports/container.log 2>&1
            docker inspect api-ci > reports/container-inspect.json
            docker rm -f api-ci
          fi
      - name: Guardar evidencias Docker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-results
          path: |
            reports/container.log
            reports/container-inspect.json
          retention-days: 14

  deploy:
    name: CD AWS con aprobacion
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    with:
      image: ${{ needs.docker.outputs.image }}
